name: Runtime Pipeline Unittest

on:
  workflow_call:

jobs:
  build:

    runs-on: ubuntu-22.04
    env:
      DB_DATABASE: pipeline_test
      DB_USER: root
      DB_PASSWORD: root
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/runtime/bamboo-pipeline:${{ github.workspace }}/runtime/bamboo-pipeline/test
    strategy:
      matrix:
        python-version: [3.12.10]
        django-version: ["4.2", "5.2"]

    steps:

    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up MySQL
      run: |
        sudo /etc/init.d/mysql start
        mysql -e 'CREATE DATABASE ${{ env.DB_DATABASE }} default character set utf8mb4 collate utf8mb4_unicode_ci;' -u${{ env.DB_USER }} -p${{ env.DB_PASSWORD }}

    - name: Set up Poetry
      uses: abatilo/actions-poetry@v2.0.0
      with:
        poetry-version: 2.0.0

    - name: Install urllib3
      run: |
        python -m pip install urllib3==2.3.0

    - name: Install Dependencies
      run: |
        cd runtime/bamboo-pipeline/
        poetry install
        poetry run pip install "Django~=${{ matrix.django-version }}.0"

    - name: Run Tests
      if: matrix.django-version == '4.2'
      run: |
        cp -r bamboo_engine runtime/bamboo-pipeline/test
        cp -r runtime/bamboo-pipeline/pipeline runtime/bamboo-pipeline/test
        cd runtime/bamboo-pipeline/test
        poetry run coverage run --source="." manage.py test pipeline.tests
        poetry run coverage report -m
        # These functions are not collected by Django's unittest runner.
        env -u DJANGO_SETTINGS_MODULE PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 poetry run python -m pytest pipeline/tests/core/data/test_sandbox_builder.py -q
        # Verify rendering/failure handling without MySQL, Redis or a broker.
        poetry run python manage.py test --settings=pipeline_sdk_use.security_test_settings pipeline.tests.core pipeline.tests.engine.core
      env:
        PIPELINE_TEST_DB_TYPE: mysql
        PIPELINE_TEST_DB_NAME: pipeline_test
        PIPELINE_TEST_DB_USER: root
        PIPELINE_TEST_DB_PWD: root

    # Existing index_together models and timezone-field constraints exclude Django 5.
    # Exercise the render/data boundary there without changing application dependencies.
    - name: Django 5 render compatibility
      if: matrix.django-version == '5.2'
      run: |
        cp -r bamboo_engine runtime/bamboo-pipeline/test
        cp -r runtime/bamboo-pipeline/pipeline runtime/bamboo-pipeline/test
        cd runtime/bamboo-pipeline/test
        poetry run python manage.py test --settings=pipeline_sdk_use.security_render_settings pipeline.tests.core.data.test_expression pipeline.tests.core.data.test_sandbox pipeline.tests.core.data.test_render_infrastructure pipeline.tests.core.data.test_cnvd_frame_render
        env -u DJANGO_SETTINGS_MODULE PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 poetry run python -m pytest pipeline/tests/core/data/test_sandbox_builder.py -q
