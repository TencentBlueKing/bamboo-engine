name: Runtime Pipeline Unittest

on:
  workflow_call:

jobs:
  build:

    runs-on: ubuntu-22.04
    env:
      DB_DATABASE: pipeline_test
      DB_USER: root
      DB_PASSWORD: root
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    strategy:
      matrix:
        python-version: [3.6.12, 3.7.16]
        django-version: ["2.2", "3.0"]

    steps:

    - uses: actions/checkout@v6
    - name: Set up isolated Poetry for legacy Python
      run: |
        python3 -m venv "$RUNNER_TEMP/bamboo-poetry"
        "$RUNNER_TEMP/bamboo-poetry/bin/python" -m pip install \
          "poetry==1.2.2" "packaging==21.3" "virtualenv==20.17.1"
        echo "$RUNNER_TEMP/bamboo-poetry/bin" >> "$GITHUB_PATH"

    - name: Set up Python ${{ matrix.python-version }} with pyenv
      run: .github/scripts/setup_pyenv_python.sh ${{ matrix.python-version }}

    - name: Set up MySQL
      run: |
        sudo /etc/init.d/mysql start
        mysql -e 'CREATE DATABASE ${{ env.DB_DATABASE }} default character set utf8mb4 collate utf8mb4_unicode_ci;' -u${{ env.DB_USER }} -p${{ env.DB_PASSWORD }}

    - name: Install Dependencies
      run: |
        cd runtime/bamboo-pipeline/
        poetry env use "$PYENV_ROOT/versions/${{ matrix.python-version }}/bin/python"
        poetry install
        poetry run pip install "Django~=${{ matrix.django-version }}.0"

    - name: Run Tests
      run: |
        cp -r bamboo_engine runtime/bamboo-pipeline/test
        cp -r runtime/bamboo-pipeline/pipeline runtime/bamboo-pipeline/test
        cd runtime/bamboo-pipeline/test
        poetry run coverage run --source="." manage.py test pipeline.tests
        poetry run coverage report -m
        poetry run pytest pipeline/contrib/diagnostics/tests --ds=pipeline_sdk_use.settings -q
      env:
        PIPELINE_TEST_DB_TYPE: mysql
        PIPELINE_TEST_DB_NAME: pipeline_test
        PIPELINE_TEST_DB_USER: root
        PIPELINE_TEST_DB_PWD: root
