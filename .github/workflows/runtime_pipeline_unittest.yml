name: Runtime Pipeline Unittest

on:
  workflow_call:

jobs:
  build:

    runs-on: ubuntu-22.04
    env:
      DB_DATABASE: pipeline_test
      DB_USER: root
      DB_PASSWORD: root
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    strategy:
      matrix:
        python-version: [3.6.12, 3.7.16]
        django-version: [2.2, 3.0]

    steps:

    - uses: actions/checkout@v6
    # Keep Poetry's dependencies isolated and compatible with the Python 3.6 target.
    - name: Set up compatible Poetry
      run: |
        python3 -m venv "$RUNNER_TEMP/poetry"
        "$RUNNER_TEMP/poetry/bin/python" -m pip install "poetry==1.2.2" "packaging==21.3" "virtualenv==20.17.1"

    - name: Set up Python ${{ matrix.python-version }} with pyenv
      run: .github/scripts/setup_pyenv_python.sh ${{ matrix.python-version }}

    - name: Set up MySQL
      run: |
        sudo /etc/init.d/mysql start
        mysql -e 'CREATE DATABASE ${{ env.DB_DATABASE }} default character set utf8mb4 collate utf8mb4_unicode_ci;' -u${{ env.DB_USER }} -p${{ env.DB_PASSWORD }}

    - name: Install Dependencies
      run: |
        cd runtime/bamboo-pipeline/
        "$RUNNER_TEMP/poetry/bin/poetry" env use "$PYENV_ROOT/versions/${{ matrix.python-version }}/bin/python"
        # Avoid intermittent PyPI JSON metadata failures for this legacy sdist.
        # The version and SHA-256 are unchanged from poetry.lock.
        "$RUNNER_TEMP/poetry/bin/poetry" run python -m pip install --no-deps --no-index --find-links "https://files.pythonhosted.org/packages/9f/79/d265d783dd022541b744d002745d9e55d84c04a41930e35d8795934f6526/click-didyoumean-0.0.3.tar.gz#sha256=112229485c9704ff51362fe34b2d4f0b12fc71cc20f6d2b3afabed4b8bfa6aeb" "click-didyoumean==0.0.3"
        "$RUNNER_TEMP/poetry/bin/poetry" install
        "$RUNNER_TEMP/poetry/bin/poetry" run pip install "Django>${{ matrix.django-version }}"

    - name: Run isolated rendering security tests from this checkout
      run: |
        export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/runtime/bamboo-pipeline:$GITHUB_WORKSPACE/runtime/bamboo-pipeline/test"
        cd runtime/bamboo-pipeline/
        "$RUNNER_TEMP/poetry/bin/poetry" run python test/manage.py test pipeline.tests.core pipeline.tests.engine.core --settings=pipeline_sdk_use.security_settings --noinput

    - name: Run Tests
      run: |
        cp -r bamboo_engine runtime/bamboo-pipeline/test
        cp -r runtime/bamboo-pipeline/pipeline runtime/bamboo-pipeline/test
        cd runtime/bamboo-pipeline/test
        "$RUNNER_TEMP/poetry/bin/poetry" run coverage run --source="." manage.py test pipeline.tests
        "$RUNNER_TEMP/poetry/bin/poetry" run coverage report -m
      env:
        PIPELINE_TEST_DB_TYPE: mysql
        PIPELINE_TEST_DB_NAME: pipeline_test
        PIPELINE_TEST_DB_USER: root
        PIPELINE_TEST_DB_PWD: root
