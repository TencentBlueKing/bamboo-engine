[gh-actions]
python =
    3.12: py312

[tox]
isolated_build = true
envlist = py312

[testenv]
allowlist_externals = poetry
setenv =
    PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
commands =
    poetry install -v
    poetry run coverage run -m pytest tests -vv --disable-pytest-warnings
    poetry run coverage report -m